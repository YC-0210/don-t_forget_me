name: DontForgetMe
options:
  developmentLanguage: en
  knownRegions: [en, zh-Hant]
  bundleIdPrefix: com.chen
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
targets:
  DontForgetMe:
    type: application
    platform: iOS
    sources: [DontForgetMe]
    info:
      path: DontForgetMe/Info.plist
      properties:
        CFBundleDisplayName: Don't Forget Me
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Find when you settle somewhere, so we can remind you to take your things when you leave.
        NSLocationAlwaysAndWhenInUseUsageDescription: Remind you to take your things when you leave a place, even with your phone locked.
        UIBackgroundModes: [location]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chen.dontforgetme
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DontForgetMeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DontForgetMeTests]
    dependencies:
      - target: DontForgetMe
  DontForgetMeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DontForgetMeUITests]
    dependencies:
      - target: DontForgetMe
schemes:
  DontForgetMe:
    build:
      targets:
        DontForgetMe: all
    test:
      targets: [DontForgetMeTests, DontForgetMeUITests]
